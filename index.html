<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LL Parcels — Order Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --body-bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1f2937;
      --radius: 16px;
      --shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--body-bg);
      color: var(--text);
    }
    .navbar-brand {
      font-weight: 700;
      color: var(--primary) !important;
    }
    .card {
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: none;
      background: var(--card-bg);
      transition: all 0.3s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
    }
    .card-header {
      background: linear-gradient(120deg, var(--primary), #7c3aed);
      color: white;
      padding: 1.25rem 1.5rem;
      font-weight: 600;
    }
    .btn-primary { background: var(--primary); border: none; }
    .status-badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .status-pending { background: #fef3c7; color: #d97706; }
    .status-picked_up { background: #dcfce7; color: #16a34a; }
    .status-delivered { background: #dcfce7; color: #16a34a; font-weight: 700; }
    .status-cancelled { background: #fee2e2; color: #dc2626; }
    .role-tag {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
      color: white;
    }
    .role-admin { background: #8b5cf6; }
    .role-client { background: #10b981; }
    .btn-status {
      min-width: 110px;
      margin: 0.3rem;
      font-size: 0.85rem;
      border: none;
      color: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .auth-container {
      max-width: 480px;
      margin: 60px auto;
    }
    .form-control {
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
      outline: none;
    }
    .no-orders {
      text-align: center;
      padding: 3rem 1rem;
      color: #6b7280;
    }
    .order-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }
    @media (max-width: 768px) {
      .order-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="#"><i class="bi bi-box-seam me-2"></i>LL Parcels</a>
      <div class="d-flex align-items-center">
        <span id="userRoleDisplay" class="me-3 text-primary fw-medium"></span>
        <button id="logoutBtn" class="btn btn-sm text-muted">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <!-- Auth Section -->
    <div id="authSection" class="auth-container">
      <div id="loginTab" class="card">
        <div class="card-header text-center">Sign In</div>
        <div class="card-body p-4">
          <div class="mb-3">
            <input type="email" id="loginEmail" class="form-control" placeholder="Email">
          </div>
          <div class="mb-3">
            <input type="password" id="loginPassword" class="form-control" placeholder="Password">
          </div>
          <button id="loginBtn" class="btn btn-primary w-100 py-2 mb-3">Sign In</button>
          <div class="text-center">
            <button id="showRegister" class="btn btn-link p-0">Create Account</button>
            <span class="mx-2">•</span>
            <button id="showReset" class="btn btn-link p-0">Forgot Password?</button>
          </div>
        </div>
      </div>

      <div id="registerTab" class="card d-none">
        <div class="card-header text-center">Create Account</div>
        <div class="card-body p-4">
          <div class="mb-3">
            <input type="email" id="registerEmail" class="form-control" placeholder="Email">
          </div>
          <div class="mb-3">
            <input type="password" id="registerPassword" class="form-control" placeholder="Password (min 6 chars)">
          </div>
          <button id="registerBtn" class="btn btn-success w-100 py-2 mb-3">Create Account</button>
          <div class="text-center">
            <button id="showLoginFromRegister" class="btn btn-link p-0">Back to Login</button>
          </div>
        </div>
      </div>

      <div id="resetTab" class="card d-none">
        <div class="card-header text-center">Reset Password</div>
        <div class="card-body p-4">
          <p class="text-muted mb-3">Enter your email for a reset link.</p>
          <div class="mb-3">
            <input type="email" id="resetEmail" class="form-control" placeholder="Email">
          </div>
          <button id="resetBtn" class="btn btn-warning w-100 py-2 mb-3">Send Reset Link</button>
          <div class="text-center">
            <button id="showLoginFromReset" class="btn btn-link p-0">Back to Login</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Orders -->
    <div id="ordersSection" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 class="fw-bold">My Orders</h2>
        <button id="addOrderBtn" class="btn btn-success"><i class="bi bi-plus-circle me-2"></i> New Order</button>
      </div>
      <div id="ordersContainer" class="order-grid"></div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="addOrderModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold">New Order</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-0">
          <div class="mb-3">
            <label class="form-label">Pickup Place</label>
            <input type="text" id="pickupPlace" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Pickup Date</label>
            <input type="date" id="pickupDate" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Pickup Time</label>
            <input type="time" id="pickupTime" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Delivery Date</label>
            <input type="date" id="deliveryDate" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Delivery Time</label>
            <input type="time" id="deliveryTime" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Client Name</label>
            <input type="text" id="clientName" class="form-control" required>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button id="saveOrderBtn" class="btn btn-primary">Save Order</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Firebase Modular SDK -->
  <script type="module">
    // ✅ CORRECT IMPORTS FOR MODULAR SDK
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      updateDoc,
      doc,
      onSnapshot,
      query,
      where,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ✅ YOUR CONFIG — NO CHANGES NEEDED
    const firebaseConfig = {
      apiKey: "AIzaSyAfkl5nqHc2ABz3VKi081KOLG8T0D8_Yh8",
      authDomain: "order-pickup-a12f2.firebaseapp.com",
      projectId: "order-pickup-a12f2",
      storageBucket: "order-pickup-a12f2.firebasestorage.app",
      messagingSenderId: "132551215111",
      appId: "1:132551215111:web:9fab5609db392fe6edc2a2"
    };

    // ✅ INITIALIZE FIREBASE
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // DOM
    const authSection = document.getElementById('authSection');
    const ordersSection = document.getElementById('ordersSection');
    const ordersContainer = document.getElementById('ordersContainer');
    const userRoleDisplay = document.getElementById('userRoleDisplay');
    const logoutBtn = document.getElementById('logoutBtn');
    const addOrderBtn = document.getElementById('addOrderBtn');

    // Tabs
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const resetTab = document.getElementById('resetTab');

    // Inputs
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const registerEmail = document.getElementById('registerEmail');
    const registerPassword = document.getElementById('registerPassword');
    const resetEmail = document.getElementById('resetEmail');

    let currentUser = null;
    let isAdmin = false;

    // Set today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('pickupDate').value = today;
    document.getElementById('deliveryDate').value = today;

    // Tab switching
    document.getElementById('showRegister').onclick = () => {
      loginTab.classList.add('d-none');
      registerTab.classList.remove('d-none');
    };
    document.getElementById('showReset').onclick = () => {
      loginTab.classList.add('d-none');
      resetTab.classList.remove('d-none');
    };
    document.getElementById('showLoginFromRegister').onclick = () => {
      registerTab.classList.add('d-none');
      loginTab.classList.remove('d-none');
    };
    document.getElementById('showLoginFromReset').onclick = () => {
      resetTab.classList.add('d-none');
      loginTab.classList.remove('d-none');
    };

    // ✅ LOGIN — CORRECT MODULAR CALL
    document.getElementById('loginBtn').onclick = async () => {
      const email = loginEmail.value.trim();
      const password = loginPassword.value;
      if (!email || !password) return alert('Fill all fields.');
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        alert('Login failed: ' + err.message);
      }
    };

    // ✅ REGISTER
    document.getElementById('registerBtn').onclick = async () => {
      const email = registerEmail.value.trim();
      const password = registerPassword.value;
      if (!email || !password || password.length < 6) {
        return alert('Email and password (6+ chars) required.');
      }
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        alert('Account created! You are now signed in.');
      } catch (err) {
        alert('Registration failed: ' + err.message);
      }
    };

    // ✅ PASSWORD RESET
    document.getElementById('resetBtn').onclick = async () => {
      const email = resetEmail.value.trim();
      if (!email) return alert('Enter your email.');
      try {
        await sendPasswordResetEmail(auth, email);
        alert('Reset email sent! Check inbox & spam.');
        resetTab.classList.add('d-none');
        loginTab.classList.remove('d-none');
      } catch (err) {
        alert('Reset failed: ' + err.message);
      }
    };

    logoutBtn.onclick = () => signOut(auth);

    // Modal
    addOrderBtn.onclick = () => {
      new bootstrap.Modal(document.getElementById('addOrderModal')).show();
    };

    // Save Order
    document.getElementById('saveOrderBtn').onclick = async () => {
      const pickupPlace = document.getElementById('pickupPlace').value.trim();
      const pickupDate = document.getElementById('pickupDate').value;
      const pickupTime = document.getElementById('pickupTime').value;
      const deliveryDate = document.getElementById('deliveryDate').value;
      const deliveryTime = document.getElementById('deliveryTime').value;
      const clientName = document.getElementById('clientName').value.trim();

      if (!pickupPlace || !pickupDate || !pickupTime || !deliveryDate || !deliveryTime || !clientName) {
        return alert('All fields required.');
      }

      try {
        await addDoc(collection(db, 'orders'), {
          pickupPlace,
          pickupDate,
          pickupTime,
          deliveryDate,
          deliveryTime,
          clientName,
          status: 'pending',
          createdAt: new Date(),
          createdBy: currentUser.email
        });
        bootstrap.Modal.getInstance(document.getElementById('addOrderModal')).hide();
        // Reset form
        document.querySelectorAll('#addOrderModal input').forEach(el => el.value = '');
        document.getElementById('pickupDate').value = today;
        document.getElementById('deliveryDate').value = today;
      } catch (err) {
        alert('Error: ' + err.message);
      }
    };

    // Render orders
    function renderOrder(order, id) {
      const statusMap = {
        pending: 'Pending',
        on_way_pickup: 'On Way',
        picked_up: 'Picked Up',
        on_way_delivery: 'To Delivery',
        delivered: 'Delivered',
        cancelled: 'Cancelled',
        returned: 'Returned'
      };
      const statusClass = `status-${order.status}`;
      const roleTag = isAdmin ? 'role-admin' : 'role-client';

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <span class="role-tag ${roleTag}">${isAdmin ? 'Admin' : 'Client'}</span>
        <div class="card-header">Order #${id.substring(0,8)}</div>
        <div class="card-body p-4">
          <p><strong>Client:</strong> ${order.clientName}</p>
          <p><strong>Pickup:</strong> ${order.pickupPlace} • ${order.pickupDate} at ${order.pickupTime}</p>
          <p><strong>Delivery:</strong> ${order.deliveryDate} at ${order.deliveryTime}</p>
          <p><strong>Status:</strong> <span class="status-badge ${statusClass}">${statusMap[order.status] || order.status}</span></p>
          ${isAdmin ? renderStatusButtons(order.status, id) : ''}
        </div>
      `;
      ordersContainer.appendChild(card);
    }

    function renderStatusButtons(status, id) {
      const actions = [
        { s: 'on_way_pickup', l: 'On Way' },
        { s: 'picked_up', l: 'Picked Up' },
        { s: 'on_way_delivery', l: 'To Delivery' },
        { s: 'delivered', l: 'Delivered' },
        { s: 'cancelled', l: 'Cancelled' },
        { s: 'returned', l: 'Returned' }
      ];
      let html = '<div class="mt-3 d-flex flex-wrap gap-2 justify-content-center">';
      actions.forEach(a => {
        const color = a.s === 'cancelled' ? '#ef4444' : a.s === 'returned' ? '#f97316' : '#4f46e5';
        html += `<button class="btn btn-sm btn-status"
                 style="background:${color};color:white"
                 onclick="updateStatus('${id}', '${a.s}')">${a.l}</button>`;
      });
      html += '</div>';
      return html;
    }

    // Global function for status update (since onclick in HTML)
    window.updateStatus = async (orderId, status) => {
      try {
        await updateDoc(doc(db, 'orders', orderId), { status, updatedAt: new Date() });
      } catch (err) {
        alert('Update failed: ' + err.message);
      }
    };

    function loadOrders() {
      ordersContainer.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
      const q = isAdmin
        ? query(collection(db, 'orders'), orderBy('createdAt', 'desc'))
        : query(collection(db, 'orders'), where('createdBy', '==', currentUser.email), orderBy('createdAt', 'desc'));

      onSnapshot(q, (snapshot) => {
        ordersContainer.innerHTML = '';
        if (snapshot.empty) {
          ordersContainer.innerHTML = `
            <div class="col-12">
              <div class="no-orders">
                <i class="bi bi-inbox" style="font-size:3rem;color:#d1d5db"></i>
                <h5 class="mt-3">No orders</h5>
              </div>
            </div>`;
          return;
        }
        snapshot.forEach(doc => renderOrder(doc.data(), doc.id));
      }, err => {
        ordersContainer.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
      });
    }

    // Auth state
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        isAdmin = user.email === 'info@llparcels.be';
        userRoleDisplay.textContent = isAdmin ? 'Admin' : 'Client';
        authSection.classList.add('d-none');
        ordersSection.classList.remove('d-none');
        loadOrders();
      } else {
        currentUser = null;
        authSection.classList.remove('d-none');
        ordersSection.classList.add('d-none');
        userRoleDisplay.textContent = '';
        loginTab.classList.remove('d-none');
        registerTab.classList.add('d-none');
        resetTab.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
